<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooftop Hair — Beratung</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f5f4f0;
  min-height: 100vh;
  display: flex; flex-direction: column;
}

.header {
  background: #1b2f45;
  padding: 1rem 1.25rem;
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 10;
}
.header-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: #adb05e;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: #fff;
}
.header-info h1 { font-size: 15px; font-weight: 600; color: #fff; }
.header-info p { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 1px; }
.online-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #adb05e; margin-left: auto;
}

.api-bar {
  background: #fff;
  border-bottom: 0.5px solid #e0dfd9;
  padding: 8px 1.25rem;
  display: flex; align-items: center; gap: 10px;
}
.api-bar label { font-size: 11px; color: #adb05e; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; white-space: nowrap; }
.api-bar input {
  flex: 1; font-family: monospace; font-size: 12px;
  color: #1b2f45; background: #faf9f6;
  border: 0.5px solid #ddd; border-radius: 6px;
  padding: 5px 8px; outline: none;
}
.api-bar input:focus { border-color: #1b2f45; }
.api-status { font-size: 11px; white-space: nowrap; color: #bbb; }
.api-status.ok { color: #adb05e; }

.chat-area {
  flex: 1; overflow-y: auto;
  padding: 1.25rem;
  display: flex; flex-direction: column; gap: 12px;
}

.msg { display: flex; gap: 8px; max-width: 100%; }
.msg.user { flex-direction: row-reverse; }

.bubble {
  max-width: 78%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px; line-height: 1.6;
}
.msg.bot .bubble {
  background: #fff;
  border: 0.5px solid #e0dfd9;
  border-bottom-left-radius: 4px;
  color: #1b2f45;
}
.msg.user .bubble {
  background: #1b2f45;
  color: #fff;
  border-bottom-right-radius: 4px;
}

.bot-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: #adb05e; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #fff;
  margin-top: 2px;
}

.typing {
  display: flex; gap: 4px; align-items: center;
  padding: 10px 14px;
  background: #fff; border: 0.5px solid #e0dfd9;
  border-radius: 16px; border-bottom-left-radius: 4px;
  width: fit-content;
}
.typing span {
  width: 6px; height: 6px; border-radius: 50%;
  background: #adb05e; animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

.followup-bar {
  background: #fff;
  border-top: 0.5px solid #e0dfd9;
  padding: 8px 1.25rem;
  display: flex; gap: 6px; overflow-x: auto;
  scrollbar-width: none;
}
.followup-bar::-webkit-scrollbar { display: none; }
.fq-btn {
  font-size: 12px; padding: 5px 12px; white-space: nowrap;
  border: 0.5px solid #ddd; border-radius: 20px;
  background: #faf9f6; color: #666;
  cursor: pointer; font-family: inherit; transition: all 0.15s;
  flex-shrink: 0;
}
.fq-btn:hover { background: #1b2f45; color: #fff; border-color: #1b2f45; }

.input-area {
  background: #fff;
  border-top: 0.5px solid #e0dfd9;
  padding: 10px 1.25rem;
  display: flex; gap: 8px; align-items: flex-end;
}
textarea#userInput {
  flex: 1; font-family: inherit; font-size: 14px;
  color: #1b2f45; background: #faf9f6;
  border: 0.5px solid #ddd; border-radius: 20px;
  padding: 8px 14px; outline: none; resize: none;
  max-height: 100px; line-height: 1.5;
  transition: border-color 0.15s;
}
textarea#userInput:focus { border-color: #1b2f45; }

.send-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: #1b2f45; border: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: opacity 0.15s; flex-shrink: 0;
}
.send-btn:hover { opacity: 0.85; }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.send-btn svg { width: 16px; height: 16px; }

.mic-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: #faf9f6; border: 0.5px solid #ddd;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.mic-btn.active { background: #1b2f45; border-color: #1b2f45; }
.mic-btn svg { width: 16px; height: 16px; }

.time-label {
  font-size: 11px; color: #bbb; text-align: center; margin: 4px 0;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-avatar">RH</div>
  <div class="header-info">
    <h1>Rooftop Hair</h1>
    <p>Haarlokal St. Gallen · Abtwil</p>
  </div>
  <div class="online-dot"></div>
</div>

<div class="api-bar">
  <label>API Key</label>
  <input type="password" id="apiKey" placeholder="sk-ant-..." oninput="checkKey()" />
  <span class="api-status" id="apiStatus">nicht verbunden</span>
</div>

<div class="chat-area" id="chatArea"></div>

<div class="followup-bar" id="followupBar"></div>

<div class="input-area">
  <textarea id="userInput" placeholder="Nachricht schreiben..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Sprechen">
    <svg viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<script>
const SYSTEM_PROMPT = `Du bist der freundliche digitale Assistent von Rooftop Hair — einem Haarlokal in St. Gallen (Abtwil), geleitet von Stefanie Klaus. Team: Stefanie (Balayage Master), Letizia (Colour Specialist), Noemi (Creative), Joline (Junior/Budget-freundlich).

GRUNDREGELN:
1. Spiegele immer die Sprache und Begriffe der Kundin — nutze ihre Worte, nicht Fachbegriffe.
2. Nie Farbpreise nennen ohne dass die Kundin ein Foto ihres aktuellen Haarzustands geschickt hat. Wenn nach Preis gefragt: freundlich erklären dass du ohne Foto keinen seriösen Preis nennen kannst, und nach einem Foto fragen.
3. Schliesse JEDE Antwort mit einer offenen Folgefrage ab.
4. Bei Preiseinwand: sanft Joline als budgetfreundliche Alternative oder einen Filmdiscount erwähnen.
5. Bei komplexen Wünschen: persönliches Beratungsgespräch im Salon empfehlen.
6. Wenn jemand offensichtlich KI-generierte Bilder oder Filter-Fotos hochlädt: freundlich erklären dass ihr mit KI-Bildern nicht arbeiten könnt, da die Erwartungen der Kundin sonst nicht erfüllt werden können. Nach einem echten Foto des aktuellen Haarzustands fragen.
7. Termine: Kein direktes Buchungssystem. Stattdessen erklären welche Dienstleistung online buchbar ist und den Buchungslink mitteilen: https://rooftophair.ch/buchen
8. Nachfassen: Wenn eine Kundin nach einer Antwort nicht mehr reagiert, nach einem Tag freundlich nachfragen ob noch Fragen offen sind oder ob etwas unklar war (z.B. Preis, Terminfindung, etc.).
9. Nie andere Friseure oder Salons kritisieren — immer aus eigener Erfahrung sprechen.
10. Kein Drama, keine übertriebene Emotionalität — sachlich, warm, lösungsorientiert.
11. Sprache: Deutsch, du-Form, herzlich aber professionell.

TEAM-ZUORDNUNG:
- Balayage, komplexe Colorationen → Stefanie
- Colour Corrections, Colorationen → Letizia  
- Kreative Schnitte, ungewöhnliche Looks → Noemi
- Budget-freundliche Dienstleistungen, Schnitte → Joline`;

let conversationHistory = [];
let recognition = null;
let isListening = false;

const quickReplies = [
  "Was kostet eine Balayage?",
  "Wie lange dauert ein Termin?",
  "Habt ihr kurzfristig Termine?",
  "Was ist der Unterschied Balayage vs. Highlights?",
  "Kann ich ein Beratungsgespräch buchen?",
  "Welche Dienstleistungen bietet ihr an?"
];

function checkKey() {
  const key = document.getElementById('apiKey').value.trim();
  const status = document.getElementById('apiStatus');
  if (key.startsWith('sk-ant-') && key.length > 20) {
    status.textContent = '✓ verbunden';
    status.className = 'api-status ok';
  } else {
    status.textContent = 'nicht verbunden';
    status.className = 'api-status';
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function addMessage(role, text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  if (role === 'bot') {
    div.innerHTML = `
      <div class="bot-avatar">RH</div>
      <div class="bubble">${text.replace(/\n/g, '<br>')}</div>`;
  } else {
    div.innerHTML = `<div class="bubble">${text.replace(/\n/g, '<br>')}</div>`;
  }

  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typingIndicator';
  div.innerHTML = `
    <div class="bot-avatar">RH</div>
    <div class="typing"><span></span><span></span><span></span></div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function renderQuickReplies() {
  const bar = document.getElementById('followupBar');
  bar.innerHTML = '';
  quickReplies.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'fq-btn';
    btn.textContent = q;
    btn.onclick = () => {
      document.getElementById('userInput').value = q;
      sendMessage();
    };
    bar.appendChild(btn);
  });
}

async function sendMessage() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey.startsWith('sk-ant-')) {
    alert('Bitte zuerst den Anthropic API Key eingeben.');
    return;
  }

  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('followupBar').innerHTML = '';

  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });

    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Entschuldigung, etwas ist schiefgelaufen.';

    removeTyping();
    addMessage('bot', reply);
    conversationHistory.push({ role: 'assistant', content: reply });
    renderQuickReplies();

  } catch(e) {
    removeTyping();
    addMessage('bot', 'Verbindungsfehler. Bitte nochmal versuchen.');
  }

  document.getElementById('sendBtn').disabled = false;
}

// Mic
function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Spracherkennung nur in Chrome verfügbar.');
    return;
  }
  if (isListening) { recognition.stop(); return; }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'de-CH';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isListening = true;
    const btn = document.getElementById('micBtn');
    btn.classList.add('active');
    btn.querySelector('svg').setAttribute('stroke', '#fff');
  };

  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    document.getElementById('userInput').value = text;
    autoResize(document.getElementById('userInput'));
  };

  recognition.onend = () => {
    isListening = false;
    const btn = document.getElementById('micBtn');
    btn.classList.remove('active');
    btn.querySelector('svg').setAttribute('stroke', '#888');
  };

  recognition.onerror = () => {
    isListening = false;
    document.getElementById('micBtn').classList.remove('active');
  };

  recognition.start();
}

// Init
window.onload = () => {
  renderQuickReplies();
  setTimeout(() => {
    addMessage('bot', 'Hallo! Schön dass du da bist. 👋\n\nIch bin der digitale Assistent von Rooftop Hair in St. Gallen. Ich helfe dir gerne bei Fragen zu unseren Dienstleistungen, Preisen und Terminen.\n\nWas kann ich für dich tun?');
    conversationHistory.push({
      role: 'assistant',
      content: 'Hallo! Schön dass du da bist. 👋\n\nIch bin der digitale Assistent von Rooftop Hair in St. Gallen. Ich helfe dir gerne bei Fragen zu unseren Dienstleistungen, Preisen und Terminen.\n\nWas kann ich für dich tun?'
    });
  }, 600);
};
</script>
</body>
</html>
